services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: jove
      POSTGRES_PASSWORD: jove
      POSTGRES_DB: jove
    ports:
      - "5432:5432"
    volumes:
      - jove_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jove -d jove"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg://jove:jove@db:5432/jove
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-change-me-in-production}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173}
      HOME_ASSISTANT_BASE_URL: ${HOME_ASSISTANT_BASE_URL:-}
      HOME_ASSISTANT_TOKEN: ${HOME_ASSISTANT_TOKEN:-}
      GCODE_UPLOAD_DIR: /app/data/uploads
      INITIAL_ADMIN_USERNAME: ${INITIAL_ADMIN_USERNAME:-admin}
      INITIAL_ADMIN_PASSWORD: ${INITIAL_ADMIN_PASSWORD:-change-me-on-first-login}
    ports:
      - "8000:8000"
    volumes:
      - jove_uploads:/app/data/uploads
    depends_on:
      db:
        condition: service_healthy

volumes:
  jove_pgdata:
  jove_uploads:
